services:
  - type: web
    name: smart-complaint-system
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run seed && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
